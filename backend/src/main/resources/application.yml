spring:
  application:
    name: ipl-draft-club
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ipl_draft}
    username: ${DB_USERNAME:ipl_user}
    password: ${DB_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  firebase:
    # Set to false only in automated tests (a test TokenVerifier is supplied instead).
    enabled: ${FIREBASE_ENABLED:true}
    project-id: ${FIREBASE_PROJECT_ID:}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  security:
    require-email-verified: ${REQUIRE_EMAIL_VERIFIED:false}
  seed:
    # Loads the clearly-labelled DEVELOPMENT SAMPLE dataset (idempotent).
    enabled: ${SEED_SAMPLE_DATA:true}
    # Optional: import any extra CSV on startup (same format as the sample file).
    csv-path: ${SEED_CSV_PATH:}
  rate-limit:
    start-draft-per-minute: ${RATE_LIMIT_START_PER_MINUTE:20}

logging:
  level:
    root: INFO
    com.ipldraftclub: INFO

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.ipldraftclub: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
app:
  seed:
    enabled: ${SEED_SAMPLE_DATA:false}
